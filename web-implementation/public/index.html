<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>PJ_Elucidator Web</title>
    <link rel="stylesheet" type="text/css" href="/style.css">

    <script type="importmap">
        {
            "imports" : {
                "three" : "https://unpkg.com/three@0.162.0/build/three.module.js"
            }
        }
    </script>

    <script type="module" src="./hand-tracking.js" defer></script>
    <script type="module" src="./3d-space.js" defer></script>
</head>
<body>
    <button class="button" id="startButton">Link Start!</button>
    <button class="button" id="stopButton">Camera Stop</button>

    <ul class="grid">
        <li class="grid-item">
            <dt class="video-headline">Webカメラの映像</dt>
            <dd class="video-show-window">
                <video class="webCam" id="webCam" autoplay muted>カメラが読み込めません</video>
            </dd>
        </li>
        <li class="grid-item">
            <dt class="video-headline">トラッキング映像</dt>
            <dd class="video-show-window">
                <div id="output_canvas"></div>
            </dd>
        </li>
    </ul>
</body>
</html>
